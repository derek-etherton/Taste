[project]
name = "taste"
version = "0.1.0"
description = "Person-centred film recommender (PoC)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "rapidfuzz",
    "streamlit",
    "streamlit-keyup",
    "truststore",  # OS certificate store for the dataset download
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["taste*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
